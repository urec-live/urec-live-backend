include /etc/nginx/urec/backend-upstream.conf;

server {
    listen 80;
    root /usr/share/nginx/html;
    location ~ ^/(api/(auth/(login|register|refresh|google)|badges|chat|equipment-issues|exercises|gyms|help-requests|league|machines|media|plans|sessions|social|users/me/gym)|ws)(/|$) {
        include /etc/nginx/urec/backend-proxy.conf;
    }
    location ~ ^/(api|ws)(/|$) {
        return 404;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
