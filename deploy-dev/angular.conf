include /etc/nginx/urec/backend-upstream.conf;

server {
    listen 80;
    root /usr/share/nginx/html;
    location ~ ^/(api/(admin|auth/(login|refresh))|ws)(/|$) {
        include /etc/nginx/urec/backend-proxy.conf;
    }
    location ~ ^/(api|ws)(/|$) {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
