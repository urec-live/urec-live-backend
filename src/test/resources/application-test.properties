# Used by tests annotated @ActiveProfiles("test"): an in-memory H2 database in PostgreSQL mode,
# so integration tests never need the Neon database or the .env variables.
spring.datasource.url=jdbc:h2:mem:urec-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# HS512 needs a key of at least 64 bytes
jwt.secret=integration-test-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
